<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root { --ink:#0A0B0B; --aqua:#62C6C2; --white:#F4F8F8; --mute:#93A5A4; }
  html,body{margin:0;background:var(--ink)}
  .c{position:relative;width:1200px;height:627px;overflow:hidden;box-sizing:border-box;padding:72px 80px;
     background:radial-gradient(700px 500px at 100% 0%, rgba(98,198,194,.20), transparent 60%),linear-gradient(180deg,#131516,#0A0B0B);
     font-family:"Montserrat",Arial,sans-serif;color:var(--white)}
  .eyebrow{font-weight:500;font-size:19px;letter-spacing:.34em;color:var(--aqua);text-transform:uppercase}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:116px;line-height:1;margin:22px 0 0;letter-spacing:.01em}
  h1 span{color:var(--aqua);font-style:italic;font-weight:500}
  ul{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;font-weight:500;font-size:19px;letter-spacing:.1em;text-transform:uppercase}
  li{display:flex;align-items:center;gap:14px}
  li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--aqua)}
  .foot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--aqua);padding-top:22px;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:23px;color:var(--mute)}
  .foot b{font-family:"Montserrat",Arial,sans-serif;font-style:normal;color:var(--white);font-weight:600;font-size:18px;letter-spacing:.2em;text-transform:uppercase}
</style></head>
<body><div class="c">
  <div class="eyebrow">Izi Murray · Keynote Speaker</div>
  <h1>Book Izi <span>to speak</span></h1>
  <ul>
    <li>Resilience after setbacks</li><li>Confidence vs. arrogance</li>
    <li>Ownership &amp; discipline</li><li>Leading without going it alone</li>
  </ul>
  <div class="foot"><span>Athletes · Teams · Schools · Parents · Faith communities</span><b>Message me to book</b></div>
</div></body></html>
