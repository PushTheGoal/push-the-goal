<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root { --ink:#0A0B0B; --aqua:#62C6C2; --white:#F4F8F8; --mute:#93A5A4; }
  html,body{margin:0;padding:0;background:var(--ink)}
  .b{position:relative;width:1584px;height:396px;overflow:hidden;background:
      radial-gradient(900px 420px at 92% -10%, rgba(98,198,194,.18), transparent 60%),
      radial-gradient(520px 520px at 8% 120%, rgba(98,198,194,.09), transparent 70%),
      linear-gradient(180deg,#121415 0%,#0A0B0B 100%);
     font-family:"Montserrat",Arial,sans-serif;color:var(--white)}
  /* spotlight beam, top-left */
  .beam{position:absolute;left:-120px;top:-200px;width:700px;height:900px;
      background:linear-gradient(160deg, rgba(150,220,216,.15) 0%, rgba(150,220,216,.05) 40%, transparent 70%);
      transform:rotate(-24deg);filter:blur(6px)}
  .rule{position:absolute;left:470px;right:72px;bottom:44px;height:1px;background:linear-gradient(90deg,var(--aqua),rgba(98,198,194,0))}
  .txt{position:absolute;left:470px;right:72px;top:52px}
  .eyebrow{font-weight:500;font-size:17px;letter-spacing:.34em;color:var(--aqua);text-transform:uppercase;display:flex;gap:16px;align-items:center}
  .eyebrow i,.roles i{width:5px;height:5px;border-radius:50%;background:var(--aqua);display:inline-block}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:112px;line-height:1.02;margin:14px 0 0;letter-spacing:.02em}
  h1 span{color:var(--aqua);font-style:italic;font-weight:500;letter-spacing:0}
  .roles{margin-top:18px;display:flex;align-items:center;gap:18px;white-space:nowrap;font-weight:500;font-size:18px;letter-spacing:.15em;text-transform:uppercase}
  .proof{position:absolute;right:72px;bottom:60px;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500;font-size:22px;color:var(--mute)}
  .proof b{color:var(--white);font-weight:600}
</style></head>
<body><div class="b">
  <div class="beam"></div>
  <div class="txt">
    <div class="eyebrow">Izi Murray <i></i> Now booking keynotes &amp; workshops</div>
    <h1>KEYNOTE <span>Speaker</span></h1>
    <div class="roles">Podcast Host · The Long Game <i></i> College Soccer Recruitment Specialist</div>
  </div>
  <div class="proof">Two ACL tears. Five knee surgeries. <b>Still played Division I.</b></div>
  <div class="rule"></div>
</div></body></html>
