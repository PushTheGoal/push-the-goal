name: Website Deploy

# Builds push-the-goal.com (the Astro site in website/) and uploads it to Cloudflare Pages.
#
#   push to main (website/ changed)  production deploy
#   pull request (website/ changed)  preview at <branch>.push-the-goal.pages.dev
#   schedule                         morning rebuild: puts future-dated blog posts live on their date
#                                    (posts are dated 21:00 UTC; the rebuild runs right after)
#
# The build ends with website/tools/check-site.mjs, which fails (so nothing deploys) if any old
# push-the-goal.com address stops working, an internal link breaks, or banned wording slips in.
#
# Needs, in Settings > Secrets and variables > Actions:
#   secret CLOUDFLARE_API_TOKEN   token with Account > Cloudflare Pages > Edit
#   secret CLOUDFLARE_ACCOUNT_ID  the Cloudflare account the site lives in
# Starting on Leslie's Cloudflare account; moving to Izi's later = change these two secrets.
# The contact form is Izi's GHL form, embedded on /contact/ (id in website/src/data/site.ts).

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-deploy.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website-deploy.yml']
  schedule:
    - cron: '20 21 * * *'
  workflow_dispatch:

concurrency:
  group: website-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT: push-the-goal

defaults:
  run:
    working-directory: website

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build and check every old URL
        run: npm run build

      - name: Check the Cloudflare settings are here
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "pull_request" ]; then
            echo "::notice::Cloudflare secrets not set yet. Built and checked; no preview deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Cloudflare secrets not set (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). Built but not deployed."
            exit 1
          fi

      - name: Make sure the Pages project exists
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT"; then
            echo "Pages project $PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi

      # Run from website/ so wrangler also uploads functions/ (the middleware: 410s and noindex on previews).
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message || github.event_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$PROJECT" \
            --branch="$BRANCH" \
            --commit-hash="$SHA" \
            --commit-message="$(printf '%s' "$MESSAGE" | head -n1 | cut -c1-200)"
